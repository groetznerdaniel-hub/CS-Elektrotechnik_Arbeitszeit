<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeitszeiterfassung für CS Elektrotechnik</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFF00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Arbeitszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--page:#FFFF00;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7380;--bd:#e1e4e8;--ac:#2563eb;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button,input{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.bad{background:transparent;color:var(--bad);padding:4px 10px;font-size:1.2rem;font-weight:700;line-height:1}
.x{position:sticky;right:0;background:var(--card);text-align:right}
input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:3px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;text-align:center}
.big{font-size:1.5rem;font-weight:600}
.mu{color:var(--mu);font-size:.85rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.8rem;color:var(--mu);font-weight:500}
tr.cl{cursor:pointer}
.combo{position:relative;display:flex;align-items:stretch}
.combo input{border-top-right-radius:0;border-bottom-right-radius:0;min-width:0}
.dd{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-left:0;border-radius:0;padding:0 10px}
.combo .dd:last-of-type{border-radius:0 8px 8px 0}
.ddl{display:none;position:absolute;top:100%;left:0;min-width:100%;max-height:220px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.2);margin-top:2px}
.ddl div{padding:9px 12px;cursor:pointer;white-space:nowrap;color:var(--tx);font-size:1rem}
.ddl div:hover{background:var(--bg)}
.stamprow{display:flex;gap:10px}
.stamprow button{flex:1;padding:14px 10px;font-size:1.05rem;font-weight:600}
.sin{background:#16a34a}.sout{background:#dc2626}
.menuwrap{position:relative;display:inline-block;margin-bottom:12px}
button.menu{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;padding:9px 14px}
.menul{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:30;min-width:200px;overflow:hidden}
.menul button{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border-radius:0;padding:12px 16px}
.menul button.on{background:var(--page);font-weight:700}
.card textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;font:inherit;color:inherit;resize:vertical}
.imp h2{margin:0 0 8px;font-size:1.2rem}
.imp p{margin:0 0 12px}
.imp a{color:var(--ac)}
.err{color:var(--bad);font-size:.9rem;margin-top:8px}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
function today(){const n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate());}
function hm(){const n=new Date();return p2(n.getHours())+':'+p2(n.getMinutes());}
const KEY='az-data';
let D={name:'',rate:15,fpRate:12.5,entries:[],payouts:[]};
try{const r=localStorage.getItem(KEY);if(r)D=Object.assign(D,JSON.parse(r));}catch(e){}
let page='erfassen',pend=null,fpOn=false,tab=1,month=today().slice(0,7),msg='',imp=[],open=null,dl=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){msg='Speichern im Browser nicht möglich.';}};
const tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b;};
const wd=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'long'});
const fd=d=>d.split('-').reverse().join('.');
const fh=h=>{const neg=h<0,m=Math.round(Math.abs(h)*60);return(neg?'−':'')+Math.floor(m/60)+':'+p2(m%60)+' h';};
const work=e=>Math.max(0,tm(e.e)-tm(e.b)-(e.p||0)+0)/60;
const fe=v=>v.toFixed(2).replace('.',',')+' €';
const pay=e=>work(e)*D.rate+(e.fp?D.fpRate:0);
const sumPay=()=>D.entries.reduce((a,e)=>a+pay(e),0);
const sumW=()=>D.entries.reduce((a,e)=>a+work(e),0);
const sumP=()=>D.payouts.reduce((a,p)=>a+p.h,0);

function stSt(){const s=D.stamp,o=$('#st');if(!o)return;
  const t=s&&s.se&&s.e?'Ausgestempelt um '+s.e:(s&&s.st&&s.b?'Eingestempelt seit '+s.b:'');
  o.textContent=t+(t&&s.pm>0?' · Pause '+s.pm+' min':'');}
function stamp(kind){
  const now=hm(),S=D.stamp;
  if(kind=='in'){
    if(S&&S.d===today()&&S.b&&S.se&&S.e){
      const gap=tm(now)-tm(S.e);S.pm=(S.pm||0)+(gap>0?gap:0);S.st=1;S.se=0;S.e='';
    }else if(S&&S.d===today()&&S.st&&!S.se){}
    else{D.stamp={d:today(),b:now,st:1};useLocation(true);}
  }else{D.stamp=S||{};D.stamp.e=now;D.stamp.se=1;if(!D.stamp.d)D.stamp.d=today();}
  persist();
  if(!$('#b')){render();return;}
  $('#d').value=D.stamp.d;if(D.stamp.b)$('#b').value=D.stamp.b;$('#e').value=D.stamp.e||'16:00';
  if(D.stamp.pm!=null)$('#p').value=D.stamp.pm;
  stSt();
}
function addEntry(){
  const nmf=$('#nm');if(nmf){D.name=nmf.value.trim();persist();}
  if(!D.name){msg='Bitte zuerst den Namen des Mitarbeiters eingeben.';return render();}
  const d=$('#d').value,b=$('#b').value,e=$('#e').value;
  if(!d||!b||!e||tm(e)<=tm(b)){msg='Bitte Datum, Beginn und Ende angeben (Ende nach Beginn).';return render();}
  D.entries.push({id:String(Date.now()),d,ort:$('#o').value.trim(),tat:$('#t').value.trim(),b,e,p:+$('#p').value||0,fp:fpOn});
  fpOn=false;D.stamp=null;msg='';persist();render();
}
function addPayout(){
  const h=parseFloat(String($('#ph').value).replace(',','.'))||0,f=parseInt($('#pf').value)||0,d=$('#pd').value;
  if(!(h>0||f>0)||!d){msg='Bitte Datum sowie Stunden und/oder Fahrpauschalen für die Auszahlung angeben.';return render();}
  D.payouts.push({id:String(Date.now()),d,h,fp:f,n:$('#pn').value.trim()});msg='';persist();render();
}
async function saveFile(o){
  if(!o.plain&&window.showSaveFilePicker){try{
    const h=await showSaveFilePicker({suggestedName:o.filename,types:[{description:'CSV-Datei',accept:{'text/csv':['.csv']}}]});
    const w=await h.createWritable();await w.write(o.data);await w.close();return;}
  catch(e){if(e&&e.name=='AbortError')return;}}
  const blob=new Blob([o.data],{type:'text/csv;charset=utf-8'});
  try{const f=new File([blob],o.filename,{type:'text/csv'});
    if(!o.plain&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e&&e.name=='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csvFile(){
  const L=[['Mitarbeiter','Typ','Datum','Wochentag','Ort','Tätigkeit','Beginn','Ende','Pause (min)','Fahrpauschale','Arbeitszeit (h)','Verdienst (€)','Stundenlohn (€)','Fahrpauschale (€)'].join(';')];
  const n=x=>x.toFixed(2).replace('.',',');
  D.entries.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(e=>L.push([q(D.name),'Arbeit',e.d,wd(e.d),q(e.ort),q(e.tat),e.b,e.e,e.p,e.fp?'Ja':'',n(work(e)),n(pay(e)),n(D.rate),n(D.fpRate)].join(';')));
  D.payouts.forEach(p=>L.push([q(D.name),'Auszahlung',p.d,wd(p.d),'',q(p.n),'','','',p.fp?'-'+p.fp:'',n(-p.h),'',n(D.rate),n(D.fpRate)].join(';')));
  return {filename:'arbeitszeiten'+(D.name?'-'+D.name.replace(/\W+/g,'_'):'')+'-'+today()+'.csv',data:'\ufeff'+L.join('\n')};
}
async function sendTo(){
  const cm=$('#cm');if(cm){D.msg=cm.value;persist();}
  const nmf=$('#nm');if(nmf){D.name=nmf.value.trim();persist();}
  if(!D.name){msg='Bitte zuerst den Namen des Mitarbeiters eingeben.';return render();}
  const m=(D.msg||'').trim(),text=(m?m+'\n\n':'')+D.name,c=csvFile();
  try{
    const f=new File([new Blob([c.data],{type:'text/csv;charset=utf-8'})],c.filename,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Arbeitszeit',text});return;}
  }catch(e){if(e&&e.name=='AbortError')return;}
  await saveFile({plain:true,...c});
  const a=document.createElement('a');
  a.href='mailto:Chris8800@gmx.de?subject='+encodeURIComponent('Arbeitszeit')+'&body='+encodeURIComponent(text);
  document.body.appendChild(a);a.click();a.remove();
}
async function exportCsv(plain){
  const nmf=$('#nm');if(nmf){D.name=nmf.value.trim();persist();}
  if(!D.name){msg='Bitte zuerst den Namen des Mitarbeiters eingeben.';return render();}
  try{await saveFile({plain,...csvFile()});return true;}catch(e){msg='Export nicht möglich.';render();return false;}
}
function mine(){
  const w=sumW(),p=sumP(),fpT=D.entries.filter(e=>e.fp).length,fpP=D.payouts.reduce((a,x)=>a+(x.fp||0),0),off=(w-p)*D.rate+(fpT-fpP)*D.fpRate,t=today();
  const L=D.entries.filter(e=>e.d.startsWith(month)).sort((a,b)=>b.d.localeCompare(a.d));
  const mw=L.reduce((a,e)=>a+work(e),0);
  const rows=L.map(e=>`<tr><td>${fd(e.d)}</td><td>${wd(e.d)}</td><td>${esc(e.ort)}</td><td>${esc(e.tat)}</td><td>${e.b}–${e.e}</td><td>${e.p}</td><td>${e.fp?'✓':''}</td><td><b>${fh(work(e))}</b></td><td>${fe(pay(e))}</td><td class="x"><button class="bad" data-de="${e.id}"${pend==='e'+e.id?' style="background:var(--bad);color:#fff;font-size:.9rem"':''}>${pend==='e'+e.id?'Löschen?':'✕'}</button></td></tr>`).join('');
  const pr=D.payouts.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<tr><td>${fd(x.d)}</td><td>${fh(x.h)}</td><td>${x.fp||0}</td><td>${esc(x.n)}</td><td class="x"><button class="bad" data-dp="${x.id}"${pend==='p'+x.id?' style="background:var(--bad);color:#fff;font-size:.9rem"':''}>${pend==='p'+x.id?'Löschen?':'✕'}</button></td></tr>`).join('');
  const A=`<div class="card"><label>Name des Mitarbeiters<input id="nm" value="${esc(D.name)}" placeholder="Vor- und Nachname" autocomplete="name" style="width:260px"></label></div>`,B=`<div class="card"><div class="sum"><div><div class="mu">Gearbeitet gesamt</div><div class="big">${fh(w)}</div></div><div><div class="mu">Ausbezahlt</div><div class="big">${fh(p)}</div></div><div><div class="mu">Verbleibend</div><div class="big">${fh(w-p)}</div></div><div><div class="mu">Verdienst gesamt</div><div class="big">${fe(sumPay())}</div></div><div><div class="mu">Offener Betrag</div><div class="big">${fe(off)}</div><div class="mu">inkl. ${fpT-fpP} Fahrpauschale(n)</div></div></div></div>`,C=`<div class="card"><b>Neuer Eintrag</b><div class="row" style="margin-top:8px">
    <label>Datum<input id="d" type="date" value="${(D.stamp&&D.stamp.d)||t}"></label><label>Ort<span class="combo"><input id="o" value="${esc((D.stamp&&D.stamp.o)||'')}" style="width:130px"><button type="button" class="dd" data-geo="1" aria-label="Aktuellen Standort eintragen" title="Aktuellen Standort eintragen">📍</button><button type="button" class="dd" data-dd="o" aria-label="Ort auswählen">▾</button><div class="ddl" id="ddl-o"></div></span></label><label>Tätigkeit<span class="combo"><input id="t" style="width:150px"><button type="button" class="dd" data-dd="t" aria-label="Tätigkeit auswählen">▾</button><div class="ddl" id="ddl-t"></div></span></label>
    <label>Beginn<input id="b" type="time" value="${(D.stamp&&D.stamp.b)||'08:00'}"></label><label>Ende<input id="e" type="time" value="${(D.stamp&&D.stamp.e)||'16:00'}"></label>
    <label>Pause (min)<input id="p" type="number" min="0" value="${D.stamp&&D.stamp.pm!=null?D.stamp.pm:30}" style="width:90px"></label><button type="button" id="fp" class="${fpOn?'':'sec'}">${fpOn?'✓ ':''}Fahrpauschale</button><button id="add">Speichern</button></div><div class="mu" id="gst"></div>
    <div class="err">${esc(msg)}</div></div>`,Dm=`<div class="card"><div class="row" style="justify-content:space-between"><label>Monat<input id="mon" type="month" value="${month}"></label><div><div class="big">${fh(mw)}</div><div class="mu">${L.filter(e=>e.fp).length} Fahrpauschale(n) · ${fe(L.reduce((a,e)=>a+pay(e),0))}</div></div></div>
    <div class="scroll">${L.length?`<table><tr><th>Datum</th><th>Tag</th><th>Ort</th><th>Tätigkeit</th><th>Zeit</th><th>Pause</th><th>Fahrpausch.</th><th>Arbeitszeit</th><th>Verdienst</th><th class="x"></th></tr>${rows}</table>`:'<p class="mu">Keine Einträge in diesem Monat.</p>'}</div></div>`,E=`<div class="card"><b>Auszahlungen (Stunden und Fahrpauschalen)</b><div class="row" style="margin:8px 0"><label>Datum<input id="pd" type="date" value="${t}"></label><label>Stunden<input id="ph" type="number" step="0.25" min="0" style="width:90px"></label><label>Fahrpauschalen (Anzahl)<input id="pf" type="number" step="1" min="0" value="0" style="width:90px"></label><label>Notiz<input id="pn" style="width:150px"></label><button id="addp">Abziehen</button></div>
    ${pr?`<div class="scroll"><table><tr><th>Datum</th><th>Stunden</th><th>Fahrpausch.</th><th>Notiz</th><th class="x"></th></tr>${pr}</table></div>`:''}</div>`,F=`<div class="card"><div class="row">
    <label>Stundenlohn (€)<input id="rt" type="number" step="0.5" min="0" value="${D.rate}" style="width:90px"></label><label>Fahrpauschale (€)<input id="fr" type="number" step="0.5" min="0" value="${D.fpRate}" style="width:90px"></label></div></div>`,G=`<div class="card"><b>Export und Nachricht an Chef Christoph</b>
    <label style="margin-top:8px">Nachricht an Chef Christoph<textarea id="cm" rows="3" placeholder="z. B. Zeiten für Oktober, bitte prüfen.">${esc(D.msg||'')}</textarea></label>
    <div class="row" style="margin-top:10px"><button id="send">Senden an</button><button id="csv">Speichern</button></div>
    <div class="err">${esc(msg)}</div>
    <div class="mu" style="margin-top:8px">„Senden an“ öffnet das Teilen-Menü deines Geräts. Wähle dort z. B. WhatsApp oder E-Mail und den Empfänger, die CSV-Datei und deine Nachricht sind schon dabei. Ohne Teilen-Menü wird die Datei gespeichert und eine E-Mail an Christoph vorbereitet (Datei bitte anhängen). „Speichern“ legt die CSV-Datei an einem Ort deiner Wahl in deinen Dateien ab. Der Dateiname enthält deinen Namen und das aktuelle Datum.</div></div>`;
  const st=`<div class="card"><div class="stamprow"><button id="sin" class="sin">Einstempeln</button><button id="sout" class="sout">Ausstempeln</button></div><div class="mu" id="st" style="margin-top:8px;color:var(--tx)"></div></div>`;
  const warn=D.name?'':`<div class="card"><b>Name fehlt</b><div class="mu">Bitte trage zuerst deinen Namen unter „Einstellungen“ ein.</div><button id="gonm" style="margin-top:8px">Zu den Einstellungen</button></div>`;
  if(page=='impressum')return `<div class="card imp"><img src="impressum.jpg" alt="Visitenkarte CS Elektrotechnik" style="width:100%;height:auto;border-radius:8px;border:1px solid var(--bd);margin-bottom:12px">
    <h2>Impressum</h2>
    <p><b>CS Elektrotechnik</b><br>Inhaber: Christoph Straub<br>Marrenstrasse 53<br>73072 Donzdorf</p>
    <p><b>Kontakt</b><br>Telefon: <a href="tel:+491701868221">+49 170 1868221</a><br>E-Mail: <a href="mailto:info.cselektrotechnik@gmail.com">info.cselektrotechnik@gmail.com</a></p>
    <p class="mu">Diese App dient der Arbeitszeiterfassung für Mitarbeiter von CS Elektrotechnik. Die erfassten Daten werden nur auf dem jeweiligen Gerät gespeichert.</p>
    <p class="mu" style="margin-top:14px;text-align:center">App created by Daniel Grötzner (KI-Prozessoptimierer)</p></div>`;
  if(page=='uebersicht')return B+Dm;
  if(page=='auszahlungen')return E;
  if(page=='einstellungen')return A+F+G;
  return warn+st+C;
}
const PAGES=[['erfassen','Erfassen'],['uebersicht','Übersicht'],['auszahlungen','Auszahlungen'],['einstellungen','Einstellungen'],['impressum','Impressum']];
function render(){
  $('#app').innerHTML=mine();stSt();
  const mb=$('#menu');if(mb)mb.textContent='☰ '+PAGES.find(x=>x[0]==page)[1];
  const ml=$('#menul');if(ml)ml.innerHTML=PAGES.map(([k,n])=>'<button data-page="'+k+'"'+(k==page?' class="on"':'')+'>'+n+'</button>').join('');
}
function setGeo(t){const g=$('#gst');if(g)g.textContent=t;}
function useLocation(auto){
  const cur=$('#o');if(auto&&cur&&cur.value.trim())return;
  if(!navigator.geolocation){setGeo('Dieses Gerät unterstützt keine Standortabfrage.');return;}
  setGeo('Standort wird ermittelt …');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la=pos.coords.latitude,lo=pos.coords.longitude;let txt=la.toFixed(5)+', '+lo.toFixed(5);
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=de&lat='+la+'&lon='+lo);
      if(r.ok){const j=await r.json(),a=j.address||{};
        const street=[a.road||a.pedestrian||a.path||'',a.house_number||''].filter(Boolean).join(' ');
        const t=[street,a.city||a.town||a.village||a.municipality||''].filter(Boolean).join(', ');if(t)txt=t;}
    }catch(e){}
    const o=$('#o');if(!(auto&&o&&o.value.trim())){if(o)o.value=txt;if(D.stamp){D.stamp.o=txt;persist();}}setGeo('');
  },err=>{setGeo(err&&err.code==1?'Standortfreigabe verweigert. Bitte in den Einstellungen des Geräts erlauben.':'Standort konnte nicht ermittelt werden.');},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function toggleDD(id){const l=$('#ddl-'+id);if(!l)return;
  if(l.style.display==='block'){l.style.display='none';return;}
  const key=id=='o'?'ort':'tat',cnt={};D.entries.forEach(e=>{const v=(e[key]||'').trim();if(v)cnt[v]=(cnt[v]||0)+1;});
  const vals=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  l.innerHTML=vals.length?vals.map(v=>`<div data-v="${esc(v)}">${esc(v)}</div>`).join(''):'<div class="mu" style="cursor:default">Noch keine Einträge</div>';
  l.style.display='block';}
document.addEventListener('click',e=>{
  {const ml=$('#menul');if(ml&&!e.target.closest('#menu')&&!e.target.closest('#menul'))ml.style.display='none';}
  const op=e.target.closest('.ddl [data-v]');
  if(op){const l=op.parentNode;$('#'+l.id.slice(4)).value=op.dataset.v;l.style.display='none';return;}
  if(e.target.closest('[data-geo]')){useLocation();return;}
  const dd=e.target.closest('[data-dd]');
  document.querySelectorAll('.ddl').forEach(l=>{if(!dd||l.id!=='ddl-'+dd.dataset.dd)l.style.display='none';});
  if(dd){toggleDD(dd.dataset.dd);return;}
  const t=e.target.closest('button,tr.cl');if(!t){if(pend){pend=null;render();}return;}
  if(t.id=='menu'){const m=$('#menul');m.style.display=m.style.display==='block'?'none':'block';}
  else if(t.dataset.page){page=t.dataset.page;msg='';pend=null;$('#menul').style.display='none';render();try{window.scrollTo(0,0);}catch(x){}}
  else if(t.id=='gonm'){page='einstellungen';render();}
  else if(t.id=='sin')stamp('in');else if(t.id=='sout')stamp('out');else if(t.id=='add')addEntry();else if(t.id=='addp')addPayout();else if(t.id=='csv')exportCsv();else if(t.id=='send')sendTo();
  else if(t.id=='fp'){fpOn=!fpOn;t.className=fpOn?'':'sec';t.textContent=(fpOn?'✓ ':'')+'Fahrpauschale';}
  else if(t.dataset.de){if(pend==='e'+t.dataset.de){D.entries=D.entries.filter(x=>x.id!==t.dataset.de);pend=null;persist();}else pend='e'+t.dataset.de;render();}
  else if(t.dataset.dp){if(pend==='p'+t.dataset.dp){D.payouts=D.payouts.filter(x=>x.id!==t.dataset.dp);pend=null;persist();}else pend='p'+t.dataset.dp;render();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='d'||t.id=='b'||t.id=='e'||t.id=='o'){if(D.stamp){D.stamp[t.id]=t.value;persist();stSt();}}
  else if(t.id=='p'){if(D.stamp){D.stamp.pm=Math.max(0,parseInt(t.value)||0);persist();stSt();}}
  else if(t.id=='mon'&&t.value){month=t.value;render();}
  else if(t.id=='rt'||t.id=='fr'){const v=parseFloat(String(t.value).replace(',','.'));if(v>=0){D[t.id=='rt'?'rate':'fpRate']=v;persist();}render();}
  else if(t.id=='nm'){D.name=t.value.trim();persist();}
  else if(t.id=='cm'){D.msg=t.value;persist();}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
